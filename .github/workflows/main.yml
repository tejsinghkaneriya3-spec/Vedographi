name: VEDOGRAPHi APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Project Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Firebase Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
              fi
              echo "Restored app/google-services.json from GitHub secret."
            else
              echo "::warning::app/google-services.json not found in repository. Building APK with Guest Mode support (commit app/google-services.json or set GOOGLE_SERVICES_JSON secret to enable Google Sign-In & Cloud Sync)."
            fi
          else
            echo "Found app/google-services.json in repository."
          fi

      - name: Build Debug APK
        run: gradle --no-daemon --no-build-cache --no-configuration-cache assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDOGRAPHI-v1.1-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
